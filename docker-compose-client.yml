version: '3.9'

services:
  singbox:
    # 模拟一个伪终端
    tty: true
    # 打开标准输入，可以接受外部输入
    stdin_open: true
    # 指定容器名称
    container_name: singbox-client
    # 使用华为云镜像
    image: swr.cn-east-3.myhuaweicloud.com/iflyelf/sing-box:latest
    # 启动命令
    command: run -c /etc/sing-box/config.json
    # 宿主机共享进程命名空间
    pid: host
    # 使用系统的IPC命名空间
    ipc: host
    # 允许容器中运行一些特权命令
    privileged: true
    # 指定容器退出后的重启策略为始终重启
    restart: always
    # 指定容器的内核能力(capacity)分配
    cap_add:
      - ALL
    # 数据卷所挂载路径设置
    volumes:
      # 配置文件（只读，支持热重载）
      - ./conf/config.json:/etc/sing-box/config.json:ro,cached
      # 同步宿主机时区与时间
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
      # 共享内核（支持 TProxy、TUN 等高级功能）
      - /sys/fs/bpf:/sys/fs/bpf:rw,cached
      - /lib/modules:/lib/modules:ro,cached
      - /etc/sysctl.conf:/etc/sysctl.conf:ro,cached
    # 指定设备映射关系
    devices:
      - /dev/net/tun
    # 配置容器连接的网络（host 模式，性能最优）
    network_mode: "host"
    # 资源限制（客户端适度降低）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    # 指定容器的 ulimits 限制值
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
