services:
  singbox:
    tty: true
    stdin_open: true
    container_name: singbox-client
    image: swr.cn-east-3.myhuaweicloud.com/iflyelf/singbox-client:latest
    command: []
    pid: host
    ipc: host
    privileged: true
    restart: always
    cap_add:
      - ALL
    # 订阅环境变量：通过 .env 文件配置（不提交到仓库）
    # 设置后容器启动时自动拉取订阅并生成运行配置
    # 未设置时直接使用挂载的 conf/config.json
    env_file:
      - path: .env
        required: false
    volumes:
      - ./conf/config.json:/etc/sing-box/config.json:ro,cached
      - ./conf/config_with_sub.json:/etc/sing-box/config_with_sub.json:ro,cached
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
      - /sys/fs/bpf:/sys/fs/bpf:rw,cached
      - /lib/modules:/lib/modules:ro,cached
      - /etc/sysctl.conf:/etc/sysctl.conf:ro,cached
    devices:
      - /dev/net/tun
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
