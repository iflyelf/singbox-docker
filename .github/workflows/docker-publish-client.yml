name: 自动编译并上传 singbox-client 镜像

env:
  SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
  SWR_ORGANIZATION: iflyelf

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.client'
      - 'docker-entrypoint-client.sh'
      - 'docker-compose-client.yml'
      - 'conf/config.json'
      - 'conf/nginx-client/**'
      - 'scripts/**'
      - 'update_subscription.sh'
      - 'reload_config.sh'
      - '.github/workflows/docker-publish-client.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 sing-box 最新稳定版本
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.tag_name // empty')
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "使用 sing-box ${version}"

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录华为云 SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: 构建并发布 singbox-client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          build-args: |
            SINGBOX_VERSION=${{ steps.version.outputs.version }}
            BUILD_NGINX_IMAGE=iflyelf/nginx:latest
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/singbox-client:latest
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/singbox-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 设置 SWR 镜像为公开
        env:
          CLOUD_SDK_AK: ${{ secrets.SWR_AK }}
          CLOUD_SDK_SK: ${{ secrets.SWR_SK }}
          SWR_REGION: cn-east-3
        run: |
          if [ -z "${CLOUD_SDK_AK}" ] || [ -z "${CLOUD_SDK_SK}" ]; then
            echo "未配置 SWR_AK / SWR_SK，跳过设置公开"
            exit 0
          fi
          pip install --quiet huaweicloudsdkcore huaweicloudsdkswr
          python - <<'PY'
          import os
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkswr.v2 import SwrClient
          from huaweicloudsdkswr.v2.model import UpdateRepoRequest, UpdateRepoRequestBody
          from huaweicloudsdkswr.v2.region.swr_region import SwrRegion

          client = SwrClient.new_builder() \
              .with_credentials(BasicCredentials(os.environ["CLOUD_SDK_AK"], os.environ["CLOUD_SDK_SK"])) \
              .with_region(SwrRegion.value_of(os.environ["SWR_REGION"])) \
              .build()
          request = UpdateRepoRequest()
          request.namespace = "iflyelf"
          request.repository = "singbox-client"
          request.body = UpdateRepoRequestBody(is_public=True)
          client.update_repo(request)
          print("已设为公开: iflyelf/singbox-client")
          PY

      - name: 删除旧的 GitHub workflow
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 1
